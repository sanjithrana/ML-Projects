<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Score Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            padding: 40px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px #bbb;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #999;
        }
        .btn {
            width: 100%;
            background-color: #4CAF50;
            padding: 12px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #dff0d8;
            border: 1px solid green;
            border-radius: 5px;
            color: green;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Student Details</h2>

    <form action="/predictdata" method="POST">

        <label>Gender</label>
        <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Race/Ethnicity</label>
        <select name="race_ethnicity" required>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
        </select>

        <label>Parental Level of Education</label>
        <select name="parental_level_of_education" required>
            <option value="bachelor's degree">Bachelor's Degree</option>
            <option value="master's degree">Master's Degree</option>
            <option value="associate's degree">Associate's Degree</option>
            <option value="some college">Some College</option>
            <option value="high school">High School</option>
        </select>

        <label>Lunch</label>
        <select name="lunch" required>
            <option value="standard">Standard</option>
            <option value="free/reduced">Free/Reduced</option>
        </select>

        <label>Test Preparation Course</label>
        <select name="test_preparation_course" required>
            <option value="none">None</option>
            <option value="completed">Completed</option>
        </select>

        <label>Reading Score</label>
        <input type="number" name="reading_score" required>

        <label>Writing Score</label>
        <input type="number" name="writing_score" required>

        <button class="btn" type="submit">Predict Score</button>
    </form>

    {% if result %}
    <div class="result-box">
        Predicted Score: {{ result }}
        <h1>ich liebe du shr</h1>
    </div>
    {% endif %}

</div>

</body>
</html>
